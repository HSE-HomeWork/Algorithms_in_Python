name: CI-check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set_Up_Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Installdependencies
        run: uv sync --locked

      - name: Ruff format-check
        run: uv run ruff format --check .

      - name: Ruff lint-check
        run: uv run ruff check .

      - name: WPS
        run: uv run flake8 .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest